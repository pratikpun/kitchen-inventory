services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: pratikpun
      POSTGRES_PASSWORD: password
      POSTGRES_DB: kitchen_inventory
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pratikpun"]
      interval: 2s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pratikpun:password@db:5432/kitchen_inventory
